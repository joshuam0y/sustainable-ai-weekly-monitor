name: Hourly sustainability scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape latest articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Render report
        run: python render_report.py

      - name: Commit database + report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor.db docs/index.html
          git diff --cached --quiet || git commit -m "Automated scan update"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's own Pages deployment backend has occasional transient
      # issues unrelated to this pipeline -- confirmed in production on
      # 2026-08-17, twice in one afternoon (a 503 "no server available"
      # outage, and a 429-rate-limited download of the deploy-pages action
      # itself). The scan job's commit above already succeeded by this
      # point, so no data is ever lost either way. continue-on-error means
      # even an exhausted retry doesn't get reported as a failed run --
      # this repo only runs hourly with no faster fallback (unlike the
      # sibling mlb-player-props project's 15-minute Quick refresh), so
      # the one retry below meaningfully shrinks the window the live site
      # would otherwise sit stale on a previous deploy.
      - name: Deploy to Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
